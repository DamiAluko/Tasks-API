<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tasks</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>My Tasks</h1>

    <form id="task-form">
      <input type="text" id="title-input" placeholder="Task title" required />
      <input
        type="text"
        id="content-input"
        placeholder="Task content"
        required
      />
      <button type="submit">Add Task</button>
    </form>

    <ul id="task-list"></ul>

    <script src="script.js"></script>
  </body>
</html>
